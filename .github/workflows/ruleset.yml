name: "Code Freeze"
run-name: "${{ inputs.action }}: ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - enable
          - disable
      branch:
        description: "Branch and ruleset to update"
        required: true
        type: choice
        options:
          - "main : rulesets/123"
          - "v14 : rulesets/456"

permissions: {}

concurrency:
  group: code-freeze
  cancel-in-progress: false

jobs:
  update:
    name: Update code freeze
    if: >-
      github.repository_owner == 'cupy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Restrict this environment to the default branch and require reviewers.
    # Configure RULESET_APP_CLIENT_ID as an environment variable and
    # RULESET_APP_PRIVATE_KEY as a secret. The App needs Administration (write)
    # permission.
    environment: ruleset

    steps:
      - name: Mint ruleset App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Update code freeze
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_RULESET: ${{ inputs.branch }}
          RULESET_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -euo pipefail

          branch_ruleset_pattern='^(.+) : rulesets/([1-9][0-9]*)$'
          if [[ "${BRANCH_RULESET}" =~ ${branch_ruleset_pattern} ]]; then
            TARGET_BRANCH="${BASH_REMATCH[1]}"
            RULESET_ID="${BASH_REMATCH[2]}"
          else
            echo "::error::Unsupported branch and ruleset: ${BRANCH_RULESET}"
            exit 1
          fi

          case "${RULESET_ACTION}" in
            enable)
              enforcement="active"
              ;;
            disable)
              enforcement="disabled"
              ;;
            *)
              echo "::error::Unsupported action: ${RULESET_ACTION}"
              exit 1
              ;;
          esac

          ruleset_endpoint="repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          current_enforcement="$(
            gh api "${ruleset_endpoint}" \
              --jq ".enforcement" \
              "${api_headers[@]}"
          )"
          if [[ "${current_enforcement}" == "${enforcement}" ]]; then
            echo "::notice::Ruleset ${RULESET_ID} for ${TARGET_BRANCH} is already ${enforcement}"
          else
            updated_enforcement="$(
              gh api "${ruleset_endpoint}" \
                --method PUT \
                -f "enforcement=${enforcement}" \
                --jq ".enforcement" \
                "${api_headers[@]}"
            )"
            if [[ "${updated_enforcement}" != "${enforcement}" ]]; then
              echo "::error::Ruleset ${RULESET_ID} for ${TARGET_BRANCH} has unexpected enforcement status: ${updated_enforcement}"
              exit 1
            fi
          fi

          echo "Ruleset ${RULESET_ID} for ${TARGET_BRANCH} is ${enforcement}."
