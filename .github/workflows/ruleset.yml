name: "Code Freeze"
run-name: "${{ inputs.action }}: ${{ inputs.branch }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - "Freeze Branch"
          - "Unfreeze Branch"
      branch:
        description: "Branch to update"
        required: true
        type: choice
        options:
          - main
          - v14

permissions: {}

concurrency:
  group: code-freeze
  cancel-in-progress: false

jobs:
  update:
    name: Update code freeze
    if: >-
      github.repository_owner == 'cupy' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Restrict this environment to the default branch and require reviewers.
    # Configure RULESET_APP_CLIENT_ID as an environment variable and
    # RULESET_APP_PRIVATE_KEY as a secret. The App needs Administration (write)
    # permission.
    environment: ruleset

    steps:
      - name: Mint ruleset App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Update code freeze
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RULESET_ACTION: ${{ inputs.action }}
          RULESET_ID: "56524"
          TARGET_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          case "${TARGET_BRANCH}" in
            main|v14)
              target_ref="refs/heads/${TARGET_BRANCH}"
              ;;
            *)
              echo "::error::Unsupported branch: ${TARGET_BRANCH}"
              exit 1
              ;;
          esac

          case "${RULESET_ACTION}" in
            "Freeze Branch")
              desired_state="frozen"
              ;;
            "Unfreeze Branch")
              desired_state="unfrozen"
              ;;
            *)
              echo "::error::Unsupported action: ${RULESET_ACTION}"
              exit 1
              ;;
          esac

          ruleset_endpoint="repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}"
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          current_ruleset="$(
            gh api "${ruleset_endpoint}" \
              "${api_headers[@]}"
          )"

          if ! jq -e '
            .conditions.ref_name.include | type == "array"
          ' <<< "${current_ruleset}" >/dev/null; then
            echo "::error::Ruleset ${RULESET_ID} has invalid target branches"
            exit 1
          fi

          case "${RULESET_ACTION}" in
            "Freeze Branch")
              updated_payload="$(
                jq -c --arg ref "${target_ref}" '
                  .conditions.ref_name.include |=
                    if index($ref) == null then . + [$ref] else . end
                  | {conditions: .conditions}
                ' <<< "${current_ruleset}"
              )"
              ;;
            "Unfreeze Branch")
              updated_payload="$(
                jq -c --arg ref "${target_ref}" '
                  .conditions.ref_name.include |= map(select(. != $ref))
                  | {conditions: .conditions}
                ' <<< "${current_ruleset}"
              )"
              ;;
          esac

          current_conditions="$(jq -cS '.conditions' <<< "${current_ruleset}")"
          updated_conditions="$(jq -cS '.conditions' <<< "${updated_payload}")"
          if [[ "${current_conditions}" == "${updated_conditions}" ]]; then
            echo "::notice::${TARGET_BRANCH} is already ${desired_state}"
          else
            updated_ruleset="$(
              gh api "${ruleset_endpoint}" \
                --method PUT \
                --input - \
                "${api_headers[@]}" \
                <<< "${updated_payload}"
            )"

            if [[ "${RULESET_ACTION}" == "Freeze Branch" ]] &&
                ! jq -e --arg ref "${target_ref}" '
                  .conditions.ref_name.include | index($ref) != null
                ' <<< "${updated_ruleset}" >/dev/null; then
              echo "::error::Failed to freeze ${TARGET_BRANCH}"
              exit 1
            elif [[ "${RULESET_ACTION}" == "Unfreeze Branch" ]] &&
                ! jq -e --arg ref "${target_ref}" '
                  .conditions.ref_name.include | index($ref) == null
                ' <<< "${updated_ruleset}" >/dev/null; then
              echo "::error::Failed to unfreeze ${TARGET_BRANCH}"
              exit 1
            fi
          fi

          echo "${TARGET_BRANCH} is ${desired_state} by ruleset ${RULESET_ID}."
